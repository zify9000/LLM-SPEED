name: CI

# 回归门禁（四步）：后端 pytest + 前端语法/注入门禁 + 前端纯函数单测 + 前端渲染基准。
# 前端静态资源本地 vendored（static/vendor/），测试不依赖网络（e2e 全部走 127.0.0.1 的假网关）。
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Backend regression (pytest)
        run: python -m pytest -q -rf

      - name: Frontend syntax + injection gate
        run: bash tests/check_frontend_js.sh

      - name: Frontend pure-function tests
        run: bash tests/run_frontend_pure.sh

      - name: Frontend render benchmark + coalescing equivalence
        run: bash tests/run_frontend_render.sh
